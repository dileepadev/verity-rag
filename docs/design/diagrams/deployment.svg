<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="964" viewBox="0 0 1360 964" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Verity RAG · Deployment</title><desc id="d">Deployment: the Next.js web app on Vercel calls the verity-rag-api Cloud Run service, which gets secrets from Secret Manager and uses Supabase Postgres with pgvector, Supabase Storage, an OpenAI-compatible LLM API and Langfuse Cloud. The maintainer runs make ingest from the command line to fill Postgres and Storage.</desc><rect width="100%" height="100%" fill="#0d1117"/><text x="40" y="46" font-size="27" font-weight="700" fill="#e6edf3">Verity RAG · Deployment</text><text x="40" y="72" font-size="15" fill="#a1abb7">Where each part runs. Every service is on its free plan, and the API scales to zero when idle.</text><rect x="40" y="105" width="250" height="160" rx="18" fill="#0f141b" stroke="#2a313a" stroke-width="1.6" stroke-dasharray="5 5"/><text x="58" y="129" font-size="12" font-weight="700" letter-spacing="1.4" fill="#79828e">VERCEL</text><rect x="380" y="105" width="540" height="160" rx="18" fill="#0f141b" stroke="#2a313a" stroke-width="1.6" stroke-dasharray="5 5"/><text x="398" y="129" font-size="12" font-weight="700" letter-spacing="1.4" fill="#79828e">GOOGLE CLOUD</text><rect x="40" y="325" width="520" height="175" rx="18" fill="#0f141b" stroke="#2a313a" stroke-width="1.6" stroke-dasharray="5 5"/><text x="58" y="349" font-size="12" font-weight="700" letter-spacing="1.4" fill="#79828e">SUPABASE</text><polyline points="265.0,195.0 410.0,195.0" fill="none" stroke="#3c6da7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="410.0,195.0 399.0,200.5 399.0,189.5" fill="#3c6da7"/><polyline points="730.0,195.0 630.0,195.0" fill="none" stroke="#5b626b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><polygon points="630.0,195.0 641.0,189.5 641.0,200.5" fill="#5b626b"/><text x="680" y="175" text-anchor="middle" font-size="12.5" font-style="italic" fill="#a1abb7" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">secrets</text><polyline points="520.0,240.0 520.0,300.0 175.0,300.0 175.0,372.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="175.0,372.0 169.5,361.0 180.5,361.0" fill="#2c793a"/><polyline points="520.0,240.0 520.0,300.0 425.0,300.0 425.0,372.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="425.0,372.0 419.5,361.0 430.5,361.0" fill="#2c793a"/><polyline points="520.0,240.0 520.0,300.0 760.0,300.0 760.0,380.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="760.0,380.0 754.5,369.0 765.5,369.0" fill="#2c793a"/><polyline points="520.0,240.0 520.0,300.0 1070.0,300.0 1070.0,380.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1070.0,380.0 1064.5,369.0 1075.5,369.0" fill="#2c793a"/><polyline points="175.0,575.0 175.0,474.0" fill="none" stroke="#5b626b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><polygon points="175.0,474.0 180.5,485.0 169.5,485.0" fill="#5b626b"/><polyline points="425.0,575.0 425.0,474.0" fill="none" stroke="#5b626b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><polygon points="425.0,474.0 430.5,485.0 419.5,485.0" fill="#5b626b"/><rect x="65" y="150" width="200" height="90" rx="14" fill="#1d2a3a" stroke="#4279b9" stroke-width="2"/><text x="165.0" y="190.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Next.js web app</text><text x="165.0" y="212.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">free plan</text><rect x="410" y="150" width="220" height="90" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="520.0" y="182.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Cloud Run service</text><text x="520.0" y="204.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">verity-rag-api</text><text x="520.0" y="221.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">scales to zero</text><rect x="730" y="150" width="170" height="90" rx="14" fill="#232830" stroke="#656d76" stroke-width="2"/><text x="815.0" y="190.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Secret Manager</text><text x="815.0" y="212.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">keys and tokens</text><path d="M65,383 L65,463 A110.0,11 0 0 0 285,463 L285,383 A110.0,11 0 0 0 65,383 Z" fill="#28273a" stroke="#8867b9" stroke-width="2" stroke-linejoin="round"/><ellipse cx="175.0" cy="383" rx="110.0" ry="11" fill="#393351" stroke="#8867b9" stroke-width="2"/><text x="175.0" y="426.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Postgres + pgvector</text><text x="175.0" y="448.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">vectors and text</text><path d="M315,383 L315,463 A110.0,11 0 0 0 535,463 L535,383 A110.0,11 0 0 0 315,383 Z" fill="#28273a" stroke="#8867b9" stroke-width="2" stroke-linejoin="round"/><ellipse cx="425.0" cy="383" rx="110.0" ry="11" fill="#393351" stroke="#8867b9" stroke-width="2"/><text x="425.0" y="426.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Storage</text><text x="425.0" y="448.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">PDFs and page images</text><rect x="650" y="380" width="220" height="90" rx="14" fill="#2e2725" stroke="#ac6432" stroke-width="2"/><text x="760.0" y="420.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">LLM API</text><text x="760.0" y="442.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">OpenAI-compatible</text><rect x="960" y="380" width="220" height="90" rx="14" fill="#1a2e35" stroke="#2c8f98" stroke-width="2"/><text x="1070.0" y="420.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Langfuse Cloud</text><text x="1070.0" y="442.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">traces and dashboards</text><rect x="100" y="575" width="390" height="75" rx="14" fill="#232830" stroke="#656d76" stroke-width="2"/><text x="295.0" y="608.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">make ingest</text><text x="295.0" y="630.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">run by the maintainer · Docling and local embeddings</text><circle cx="337.5" cy="195.0" r="12" fill="#223b58" stroke="#4581c5" stroke-width="2"/><text x="337.5" y="199.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">1</text><circle cx="680.0" cy="195.0" r="12" fill="#30363d" stroke="#6c737c" stroke-width="2"/><text x="680.0" y="199.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">2</text><circle cx="284.3" cy="300.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="284.3" y="304.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">3</text><circle cx="425.0" cy="303.9" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="425.0" y="308.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">4</text><circle cx="745.0" cy="300.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="745.0" y="304.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">5</text><circle cx="1012.0" cy="300.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="1012.0" y="304.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">6</text><circle cx="175.0" cy="524.5" r="12" fill="#30363d" stroke="#6c737c" stroke-width="2"/><text x="175.0" y="529.1" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">7</text><circle cx="425.0" cy="524.5" r="12" fill="#30363d" stroke="#6c737c" stroke-width="2"/><text x="425.0" y="529.1" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">7</text><g font-size="13" fill="#a1abb7"><line x1="640" y1="585" x2="684" y2="585" stroke="#727a83" stroke-width="2.6" /><text x="696" y="589.5">Request-time call</text><line x1="640" y1="611" x2="684" y2="611" stroke="#727a83" stroke-width="2.6" stroke-dasharray="8 6" /><text x="696" y="615.5">Offline or delivery path</text></g><line x1="40" y1="662" x2="1320" y2="662" stroke="#2a313a" stroke-width="1.5"/><text x="40" y="674" font-size="13" font-weight="700" letter-spacing="1.4" fill="#a1abb7">STEPS</text><circle cx="52.0" cy="708.0" r="12" fill="#58a6ff" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="712.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">1</text><text x="74.0" y="713" font-size="15" font-weight="700" fill="#e6edf3">The web app calls the API</text><text x="74.0" y="733" font-size="13.5" fill="#a1abb7">The Next.js app on Vercel sends each question to the verity-rag-api service on Cloud Run.</text><circle cx="712.0" cy="708.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="712.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">5</text><text x="734.0" y="713" font-size="15" font-weight="700" fill="#e6edf3">The API calls the LLM</text><text x="734.0" y="733" font-size="13.5" fill="#a1abb7">Query rewriting, answer generation and sentence verification use the OpenAI-compatible LLM</text><text x="734.0" y="750" font-size="13.5" fill="#a1abb7">API.</text><circle cx="52.0" cy="780.0" r="12" fill="#8b949e" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="784.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">2</text><text x="74.0" y="785" font-size="15" font-weight="700" fill="#e6edf3">Secrets are handed to the API</text><text x="74.0" y="805" font-size="13.5" fill="#a1abb7">Secret Manager provides the API's keys and tokens to Cloud Run.</text><circle cx="712.0" cy="780.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="784.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">6</text><text x="734.0" y="785" font-size="15" font-weight="700" fill="#e6edf3">The API sends traces</text><text x="734.0" y="805" font-size="13.5" fill="#a1abb7">Each request's trace goes to Langfuse Cloud.</text><circle cx="52.0" cy="835.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="839.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">3</text><text x="74.0" y="840" font-size="15" font-weight="700" fill="#e6edf3">The API searches Postgres</text><text x="74.0" y="860" font-size="13.5" fill="#a1abb7">Vector and full-text queries run in Supabase Postgres with pgvector.</text><circle cx="712.0" cy="835.0" r="12" fill="#8b949e" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="839.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">7</text><text x="734.0" y="840" font-size="15" font-weight="700" fill="#e6edf3">Offline: the maintainer ingests</text><text x="734.0" y="860" font-size="13.5" fill="#a1abb7">make ingest runs from the command line and writes to Postgres and Storage, which keeps</text><text x="734.0" y="877" font-size="13.5" fill="#a1abb7">Docling and its OCR models out of the API image.</text><circle cx="52.0" cy="907.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="911.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">4</text><text x="74.0" y="912" font-size="15" font-weight="700" fill="#e6edf3">The API reads the source files</text><text x="74.0" y="932" font-size="13.5" fill="#a1abb7">PDFs and page images come from Supabase Storage.</text></svg>
