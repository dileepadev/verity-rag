<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="947" viewBox="0 0 1360 947" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Verity RAG · Ingestion pipeline</title><desc id="d">Ingestion pipeline: sources.yaml is fetched and hashed, parsed with Docling, normalized, chunked by structure and given a contextual header. Chunks are embedded locally and full-text indexed, stored in PostgreSQL, and summarized in an ingestion report.</desc><rect width="100%" height="100%" fill="#0d1117"/><text x="40" y="46" font-size="27" font-weight="700" fill="#e6edf3">Verity RAG · Ingestion pipeline</text><text x="40" y="72" font-size="15" fill="#a1abb7">How documents become searchable. Runs offline, before any question is asked.</text><polyline points="255.0,180.0 325.0,180.0" fill="none" stroke="#5b626b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="325.0,180.0 314.0,185.5 314.0,174.5" fill="#5b626b"/><polyline points="515.0,180.0 585.0,180.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="585.0,180.0 574.0,185.5 574.0,174.5" fill="#2c793a"/><polyline points="775.0,180.0 845.0,180.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="845.0,180.0 834.0,185.5 834.0,174.5" fill="#2c793a"/><polyline points="1035.0,180.0 1105.0,180.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1105.0,180.0 1094.0,185.5 1094.0,174.5" fill="#2c793a"/><polyline points="1200.0,230.0 1200.0,355.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200.0,355.0 1194.5,344.0 1205.5,344.0" fill="#2c793a"/><polyline points="1105.0,405.0 1070.0,405.0 1070.0,345.0 1035.0,345.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1035.0,345.0 1046.0,339.5 1046.0,350.5" fill="#2c793a"/><polyline points="1105.0,405.0 1070.0,405.0 1070.0,465.0 1035.0,465.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1035.0,465.0 1046.0,459.5 1046.0,470.5" fill="#2c793a"/><polyline points="845.0,345.0 810.0,345.0 810.0,405.0 775.0,405.0" fill="none" stroke="#7a5da7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="775.0,405.0 786.0,399.5 786.0,410.5" fill="#7a5da7"/><polyline points="845.0,465.0 810.0,465.0 810.0,405.0 775.0,405.0" fill="none" stroke="#7a5da7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="775.0,405.0 786.0,399.5 786.0,410.5" fill="#7a5da7"/><polyline points="585.0,405.0 515.0,405.0" fill="none" stroke="#7a5da7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="515.0,405.0 526.0,399.5 526.0,410.5" fill="#7a5da7"/><rect x="65" y="130" width="190" height="100" rx="14" fill="#232830" stroke="#656d76" stroke-width="2"/><text x="160.0" y="167.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">sources.yaml</text><text x="160.0" y="189.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">URL, title, version,</text><text x="160.0" y="206.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">effective date, license</text><rect x="325" y="130" width="190" height="100" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="420.0" y="175.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Fetch and hash</text><text x="420.0" y="197.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">skip unchanged files</text><rect x="585" y="130" width="190" height="100" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="680.0" y="175.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Parse with Docling</text><text x="680.0" y="197.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">layout, tables, OCR</text><rect x="845" y="130" width="190" height="100" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="940.0" y="167.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Normalize</text><text x="940.0" y="189.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">pages, sections,</text><text x="940.0" y="206.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">bounding boxes</text><rect x="1105" y="130" width="190" height="100" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="1200.0" y="165.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Structure-aware</text><text x="1200.0" y="186.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">chunking</text><text x="1200.0" y="208.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">sections kept, tables whole</text><rect x="1105" y="355" width="190" height="100" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="1200.0" y="392.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Contextual header</text><text x="1200.0" y="414.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">title, version,</text><text x="1200.0" y="431.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">section path</text><rect x="845" y="300" width="190" height="90" rx="14" fill="#28273a" stroke="#8867b9" stroke-width="2"/><text x="940.0" y="330.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Embed chunks</text><text x="940.0" y="351.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">locally</text><text x="940.0" y="373.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">open embedding model</text><rect x="845" y="420" width="190" height="90" rx="14" fill="#28273a" stroke="#8867b9" stroke-width="2"/><text x="940.0" y="460.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Full-text index</text><text x="940.0" y="482.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">tsvector</text><path d="M585,361 L585,449 A95.0,11 0 0 0 775,449 L775,361 A95.0,11 0 0 0 585,361 Z" fill="#28273a" stroke="#8867b9" stroke-width="2" stroke-linejoin="round"/><ellipse cx="680.0" cy="361" rx="95.0" ry="11" fill="#393351" stroke="#8867b9" stroke-width="2"/><text x="680.0" y="408.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">PostgreSQL</text><text x="680.0" y="430.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">pgvector + full-text</text><rect x="325" y="355" width="190" height="100" rx="14" fill="#1a2e35" stroke="#2c8f98" stroke-width="2"/><text x="420.0" y="392.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Ingestion report</text><text x="420.0" y="414.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">pages, OCR rate,</text><text x="420.0" y="431.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">tables, chunk stats</text><rect x="65" y="355" width="190" height="100" rx="14" fill="#232830" stroke="#656d76" stroke-width="2"/><text x="160.0" y="392.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Runs offline</text><text x="160.0" y="414.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">from the command line:</text><text x="160.0" y="431.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">make ingest</text><rect x="65" y="575" width="1230" height="62" rx="14" fill="#2d2c25" stroke="#a38234" stroke-width="2"/><text x="680.0" y="611.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Example contextual header:  Employment Act 2019 &gt; Part III &gt; Section 12: Overtime</text><circle cx="290.0" cy="180.0" r="12" fill="#30363d" stroke="#6c737c" stroke-width="2"/><text x="290.0" y="184.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">1</text><circle cx="550.0" cy="180.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="550.0" y="184.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">2</text><circle cx="810.0" cy="180.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="810.0" y="184.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">3</text><circle cx="1070.0" cy="180.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="1070.0" y="184.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">4</text><circle cx="1200.0" cy="292.5" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="1200.0" y="297.1" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">5</text><circle cx="1070.0" cy="375.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="1070.0" y="379.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">6</text><circle cx="1070.0" cy="435.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="1070.0" y="439.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">6</text><circle cx="810.0" cy="375.0" r="12" fill="#3e3358" stroke="#906dc5" stroke-width="2"/><text x="810.0" y="379.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">7</text><circle cx="810.0" cy="435.0" r="12" fill="#3e3358" stroke="#906dc5" stroke-width="2"/><text x="810.0" y="439.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">7</text><circle cx="550.0" cy="405.0" r="12" fill="#3e3358" stroke="#906dc5" stroke-width="2"/><text x="550.0" y="409.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">8</text><line x1="40" y1="662" x2="1320" y2="662" stroke="#2a313a" stroke-width="1.5"/><text x="40" y="674" font-size="13" font-weight="700" letter-spacing="1.4" fill="#a1abb7">STEPS</text><circle cx="52.0" cy="708.0" r="12" fill="#8b949e" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="712.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">1</text><text x="74.0" y="713" font-size="15" font-weight="700" fill="#e6edf3">Fetch and hash</text><text x="74.0" y="733" font-size="13.5" fill="#a1abb7">Each document in sources.yaml is downloaded and hashed. Files that have not changed are</text><text x="74.0" y="750" font-size="13.5" fill="#a1abb7">skipped.</text><circle cx="712.0" cy="708.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="712.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">5</text><text x="734.0" y="713" font-size="15" font-weight="700" fill="#e6edf3">Add a contextual header</text><text x="734.0" y="733" font-size="13.5" fill="#a1abb7">Each chunk gets a short header with its title, version and section path, so it makes sense on its</text><text x="734.0" y="750" font-size="13.5" fill="#a1abb7">own.</text><circle cx="52.0" cy="780.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="784.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">2</text><text x="74.0" y="785" font-size="15" font-weight="700" fill="#e6edf3">Parse with Docling</text><text x="74.0" y="805" font-size="13.5" fill="#a1abb7">Docling reads the layout and the tables, and runs OCR on scanned pages.</text><circle cx="712.0" cy="780.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="784.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">6</text><text x="734.0" y="785" font-size="15" font-weight="700" fill="#e6edf3">Build two indexes</text><text x="734.0" y="805" font-size="13.5" fill="#a1abb7">Chunks are embedded locally for vector search, and indexed with tsvector for keyword search.</text><circle cx="52.0" cy="835.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="839.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">3</text><text x="74.0" y="840" font-size="15" font-weight="700" fill="#e6edf3">Normalize</text><text x="74.0" y="860" font-size="13.5" fill="#a1abb7">Every document becomes the same simple form: pages, sections and bounding boxes.</text><circle cx="712.0" cy="835.0" r="12" fill="#bc8cff" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="839.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">7</text><text x="734.0" y="840" font-size="15" font-weight="700" fill="#e6edf3">Store everything in PostgreSQL</text><text x="734.0" y="860" font-size="13.5" fill="#a1abb7">Vectors and the full-text index are written to the same database.</text><circle cx="52.0" cy="890.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="894.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">4</text><text x="74.0" y="895" font-size="15" font-weight="700" fill="#e6edf3">Chunk by structure</text><text x="74.0" y="915" font-size="13.5" fill="#a1abb7">Sections stay together and tables are kept whole.</text><circle cx="712.0" cy="890.0" r="12" fill="#bc8cff" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="894.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">8</text><text x="734.0" y="895" font-size="15" font-weight="700" fill="#e6edf3">Write the ingestion report</text><text x="734.0" y="915" font-size="13.5" fill="#a1abb7">Pages, OCR rate, tables and chunk statistics show how well the documents were read.</text></svg>
