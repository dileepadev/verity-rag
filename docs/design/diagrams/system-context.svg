<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="947" viewBox="0 0 1360 947" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Verity RAG · System context</title><desc id="d">System context diagram: a user reaches the Next.js web app, which calls the Verity RAG API. The API uses PostgreSQL, object storage, an LLM API and Langfuse. An ingestion CLI fills PostgreSQL and object storage, and GitHub Actions deploys the API and runs evals.</desc><rect width="100%" height="100%" fill="#0d1117"/><text x="40" y="46" font-size="27" font-weight="700" fill="#e6edf3">Verity RAG · System context</text><text x="40" y="72" font-size="15" fill="#a1abb7">Who talks to whom. Solid lines happen on every question; dashed lines are offline or delivery.</text><polyline points="180.0,345.0 225.0,345.0" fill="none" stroke="#3c6da7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="225.0,345.0 214.0,350.5 214.0,339.5" fill="#3c6da7"/><polyline points="405.0,345.0 470.0,345.0" fill="none" stroke="#3c6da7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="470.0,345.0 459.0,350.5 459.0,339.5" fill="#3c6da7"/><polyline points="720.0,345.0 780.0,345.0 780.0,420.0 840.0,420.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="840.0,420.0 829.0,425.5 829.0,414.5" fill="#2c793a"/><polyline points="720.0,345.0 780.0,345.0 780.0,560.0 840.0,560.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="840.0,560.0 829.0,565.5 829.0,554.5" fill="#2c793a"/><polyline points="720.0,345.0 780.0,345.0 780.0,170.0 840.0,170.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="840.0,170.0 829.0,175.5 829.0,164.5" fill="#2c793a"/><polyline points="720.0,345.0 780.0,345.0 780.0,282.0 840.0,282.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="840.0,282.0 829.0,287.5 829.0,276.5" fill="#2c793a"/><polyline points="1110.0,470.0 1075.0,470.0 1075.0,420.0 1040.0,420.0" fill="none" stroke="#5b626b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><polygon points="1040.0,420.0 1051.0,414.5 1051.0,425.5" fill="#5b626b"/><polyline points="1110.0,520.0 1075.0,520.0 1075.0,560.0 1040.0,560.0" fill="none" stroke="#5b626b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><polygon points="1040.0,560.0 1051.0,554.5 1051.0,565.5" fill="#5b626b"/><polyline points="595.0,184.0 595.0,270.0" fill="none" stroke="#927531" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><polygon points="595.0,270.0 589.5,259.0 600.5,259.0" fill="#927531"/><text x="614" y="232" text-anchor="start" font-size="12.5" font-style="italic" fill="#a1abb7" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">deploys</text><polyline points="720.0,130.0 840.0,130.0" fill="none" stroke="#927531" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><polygon points="840.0,130.0 829.0,135.5 829.0,124.5" fill="#927531"/><text x="780" y="111" text-anchor="middle" font-size="12.5" font-style="italic" fill="#a1abb7" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">runs evals with</text><rect x="30" y="290" width="150" height="110" rx="14" fill="#1d2a3a" stroke="#4279b9" stroke-width="2"/><text x="105.0" y="340.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">User</text><text x="105.0" y="362.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">browser or phone</text><rect x="225" y="290" width="180" height="110" rx="14" fill="#1d2a3a" stroke="#4279b9" stroke-width="2"/><text x="315.0" y="332.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Web app</text><text x="315.0" y="354.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">Next.js</text><text x="315.0" y="371.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">on Vercel</text><rect x="470" y="270" width="250" height="150" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="595.0" y="323.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Verity RAG API</text><text x="595.0" y="345.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">FastAPI on Cloud Run</text><text x="595.0" y="362.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">local embedding and</text><text x="595.0" y="379.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">rerank models</text><rect x="470" y="100" width="250" height="84" rx="14" fill="#2d2c25" stroke="#a38234" stroke-width="2"/><text x="595.0" y="137.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">GitHub Actions</text><text x="595.0" y="159.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">tests and eval gate</text><rect x="840" y="110" width="200" height="84" rx="14" fill="#2e2725" stroke="#ac6432" stroke-width="2"/><text x="940.0" y="147.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">LLM API</text><text x="940.0" y="169.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">OpenAI-compatible</text><rect x="840" y="240" width="200" height="84" rx="14" fill="#1a2e35" stroke="#2c8f98" stroke-width="2"/><text x="940.0" y="277.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Langfuse</text><text x="940.0" y="299.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">OpenTelemetry traces</text><path d="M840,381 L840,459 A100.0,11 0 0 0 1040,459 L1040,381 A100.0,11 0 0 0 840,381 Z" fill="#28273a" stroke="#8867b9" stroke-width="2" stroke-linejoin="round"/><ellipse cx="940.0" cy="381" rx="100.0" ry="11" fill="#393351" stroke="#8867b9" stroke-width="2"/><text x="940.0" y="423.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">PostgreSQL</text><text x="940.0" y="445.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">pgvector + full-text</text><path d="M840,521 L840,599 A100.0,11 0 0 0 1040,599 L1040,521 A100.0,11 0 0 0 840,521 Z" fill="#28273a" stroke="#8867b9" stroke-width="2" stroke-linejoin="round"/><ellipse cx="940.0" cy="521" rx="100.0" ry="11" fill="#393351" stroke="#8867b9" stroke-width="2"/><text x="940.0" y="563.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Object storage</text><text x="940.0" y="585.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">PDFs and page images</text><rect x="1110" y="430" width="230" height="130" rx="14" fill="#232830" stroke="#656d76" stroke-width="2"/><text x="1225.0" y="482.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Ingestion CLI</text><text x="1225.0" y="504.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">make ingest, Docling,</text><text x="1225.0" y="521.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">local embedding model</text><circle cx="202.5" cy="345.0" r="12" fill="#223b58" stroke="#4581c5" stroke-width="2"/><text x="202.5" y="349.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">1</text><circle cx="437.5" cy="345.0" r="12" fill="#223b58" stroke="#4581c5" stroke-width="2"/><text x="437.5" y="349.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">2</text><circle cx="780.0" cy="382.5" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="780.0" y="387.1" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">3</text><circle cx="780.0" cy="452.5" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="780.0" y="457.1" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">4</text><circle cx="780.0" cy="257.5" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="780.0" y="262.1" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">5</text><circle cx="780.0" cy="313.5" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="780.0" y="318.1" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">6</text><circle cx="1075.0" cy="445.0" r="12" fill="#30363d" stroke="#6c737c" stroke-width="2"/><text x="1075.0" y="449.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">7</text><circle cx="1075.0" cy="540.0" r="12" fill="#30363d" stroke="#6c737c" stroke-width="2"/><text x="1075.0" y="544.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">7</text><circle cx="595.0" cy="227.0" r="12" fill="#493e23" stroke="#ae8a36" stroke-width="2"/><text x="595.0" y="231.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">8</text><circle cx="780.0" cy="130.0" r="12" fill="#493e23" stroke="#ae8a36" stroke-width="2"/><text x="780.0" y="134.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">8</text><g font-size="13" fill="#a1abb7"><line x1="40" y1="540" x2="84" y2="540" stroke="#727a83" stroke-width="2.6"/><text x="96" y="544.5">Request-time call</text><line x1="40" y1="566" x2="84" y2="566" stroke="#727a83" stroke-width="2.6" stroke-dasharray="8 6"/><text x="96" y="570.5">Offline or delivery path</text></g><line x1="40" y1="662" x2="1320" y2="662" stroke="#2a313a" stroke-width="1.5"/><text x="40" y="674" font-size="13" font-weight="700" letter-spacing="1.4" fill="#a1abb7">STEPS</text><circle cx="52.0" cy="708.0" r="12" fill="#58a6ff" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="712.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">1</text><text x="74.0" y="713" font-size="15" font-weight="700" fill="#e6edf3">A user asks a question</text><text x="74.0" y="733" font-size="13.5" fill="#a1abb7">The user opens the web app in a browser or on a phone and types a question.</text><circle cx="712.0" cy="708.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="712.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">5</text><text x="734.0" y="713" font-size="15" font-weight="700" fill="#e6edf3">The API calls the LLM</text><text x="734.0" y="733" font-size="13.5" fill="#a1abb7">Any OpenAI-compatible LLM API can be used; the provider is set in configs/.</text><circle cx="52.0" cy="763.0" r="12" fill="#58a6ff" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="767.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">2</text><text x="74.0" y="768" font-size="15" font-weight="700" fill="#e6edf3">The web app calls the API</text><text x="74.0" y="788" font-size="13.5" fill="#a1abb7">The Next.js app on Vercel sends the question to the Verity RAG API running on Cloud Run.</text><circle cx="712.0" cy="763.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="767.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">6</text><text x="734.0" y="768" font-size="15" font-weight="700" fill="#e6edf3">The API sends traces</text><text x="734.0" y="788" font-size="13.5" fill="#a1abb7">Every request produces an OpenTelemetry trace that is kept in Langfuse.</text><circle cx="52.0" cy="818.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="822.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">3</text><text x="74.0" y="823" font-size="15" font-weight="700" fill="#e6edf3">The API searches the documents</text><text x="74.0" y="843" font-size="13.5" fill="#a1abb7">Vector and full-text search both run in PostgreSQL (pgvector).</text><circle cx="712.0" cy="818.0" r="12" fill="#8b949e" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="822.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">7</text><text x="734.0" y="823" font-size="15" font-weight="700" fill="#e6edf3">Offline: ingestion fills the stores</text><text x="734.0" y="843" font-size="13.5" fill="#a1abb7">The maintainer runs make ingest. Docling and a local embedding model prepare the documents,</text><text x="734.0" y="860" font-size="13.5" fill="#a1abb7">which are written to PostgreSQL and object storage.</text><circle cx="52.0" cy="890.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="894.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">4</text><text x="74.0" y="895" font-size="15" font-weight="700" fill="#e6edf3">The API reads the source files</text><text x="74.0" y="915" font-size="13.5" fill="#a1abb7">PDFs and page images are stored in object storage.</text><circle cx="712.0" cy="890.0" r="12" fill="#e3b341" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="894.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">8</text><text x="734.0" y="895" font-size="15" font-weight="700" fill="#e6edf3">Delivery: CI deploys and checks quality</text><text x="734.0" y="915" font-size="13.5" fill="#a1abb7">GitHub Actions runs the tests and the eval gate (which calls the LLM) and deploys the API.</text></svg>
