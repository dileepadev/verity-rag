<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="981" viewBox="0 0 1360 981" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Verity RAG · Evaluation loop</title><desc id="d">Evaluation loop: the golden set and the pipeline config go to the eval runner, which produces metrics. If metrics meet the thresholds CI passes with a PR comment, otherwise CI fails and the merge is blocked. Production feedback goes to a weekly triage, which adds to the golden set.</desc><rect width="100%" height="100%" fill="#0d1117"/><text x="40" y="46" font-size="27" font-weight="700" fill="#e6edf3">Verity RAG · Evaluation loop</text><text x="40" y="72" font-size="15" fill="#a1abb7">How a change is proved safe to merge, and how real-world failures make the test set better.</text><rect x="40" y="96" width="1280" height="400" rx="18" fill="none" stroke="#1d242d" stroke-width="1.6"/><text x="58" y="120" font-size="12" font-weight="700" letter-spacing="1.4" fill="#79828e">THE QUALITY GATE</text><rect x="40" y="508" width="1280" height="132" rx="18" fill="none" stroke="#1d242d" stroke-width="1.6"/><text x="58" y="532" font-size="12" font-weight="700" letter-spacing="1.4" fill="#79828e">THE FEEDBACK LOOP</text><polyline points="255.0,190.0 290.0,190.0 290.0,260.0 325.0,260.0" fill="none" stroke="#5b626b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="325.0,260.0 314.0,265.5 314.0,254.5" fill="#5b626b"/><polyline points="255.0,380.0 290.0,380.0 290.0,310.0 325.0,310.0" fill="none" stroke="#7a5da7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="325.0,310.0 314.0,315.5 314.0,304.5" fill="#7a5da7"/><polyline points="515.0,285.0 585.0,285.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="585.0,285.0 574.0,290.5 574.0,279.5" fill="#2c793a"/><polyline points="775.0,285.0 830.0,285.0" fill="none" stroke="#288189" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="830.0,285.0 819.0,290.5 819.0,279.5" fill="#288189"/><polyline points="1050.0,285.0 1078.0,285.0 1078.0,175.0 1105.0,175.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1105.0,175.0 1094.0,180.5 1094.0,169.5" fill="#2c793a"/><text x="1070" y="258" text-anchor="end" font-size="12.5" font-style="italic" fill="#a1abb7" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">yes</text><polyline points="1050.0,285.0 1078.0,285.0 1078.0,395.0 1105.0,395.0" fill="none" stroke="#a3534f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1105.0,395.0 1094.0,400.5 1094.0,389.5" fill="#a3534f"/><text x="1070" y="322" text-anchor="end" font-size="12.5" font-style="italic" fill="#a1abb7" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">no</text><polyline points="1105.0,570.0 775.0,570.0" fill="none" stroke="#3c6da7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="775.0,570.0 786.0,564.5 786.0,575.5" fill="#3c6da7"/><polyline points="585.0,570.0 225.0,570.0 225.0,430.0" fill="none" stroke="#5b626b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="225.0,430.0 230.5,441.0 219.5,441.0" fill="#5b626b"/><rect x="65" y="140" width="190" height="100" rx="14" fill="#232830" stroke="#656d76" stroke-width="2"/><text x="160.0" y="177.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Pipeline config</text><text x="160.0" y="199.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">git SHA and</text><text x="160.0" y="216.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">config hash</text><rect x="65" y="330" width="190" height="100" rx="14" fill="#28273a" stroke="#8867b9" stroke-width="2"/><text x="160.0" y="375.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Golden set</text><text x="160.0" y="397.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">dev and test splits</text><rect x="325" y="235" width="190" height="100" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="420.0" y="272.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Eval runner</text><text x="420.0" y="294.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">dev split in CI,</text><text x="420.0" y="311.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">test split per release</text><rect x="585" y="235" width="190" height="100" rx="14" fill="#1a2e35" stroke="#2c8f98" stroke-width="2"/><text x="680.0" y="272.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Metrics</text><text x="680.0" y="294.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">retrieval, faithfulness,</text><text x="680.0" y="311.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">abstention, tokens, latency</text><polygon points="940.0,220 1050,285.0 940.0,350 830,285.0" fill="#2d2c25" stroke="#a38234" stroke-width="2" stroke-linejoin="round"/><text x="940.0" y="280.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Meets thresholds?</text><text x="940.0" y="302.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">evals/thresholds.yaml</text><rect x="1105" y="130" width="190" height="90" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="1200.0" y="170.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">CI passes</text><text x="1200.0" y="192.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">PR comment with deltas</text><rect x="1105" y="350" width="190" height="90" rx="14" fill="#30262b" stroke="#b65b57" stroke-width="2"/><text x="1200.0" y="390.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">CI fails</text><text x="1200.0" y="412.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">merge blocked</text><rect x="1105" y="525" width="190" height="90" rx="14" fill="#1d2a3a" stroke="#4279b9" stroke-width="2"/><text x="1200.0" y="555.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Production</text><text x="1200.0" y="576.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">feedback</text><text x="1200.0" y="598.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">thumbs down and traces</text><rect x="585" y="525" width="190" height="90" rx="14" fill="#232830" stroke="#656d76" stroke-width="2"/><text x="680.0" y="565.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Weekly triage</text><text x="680.0" y="587.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">feeds the golden set</text><circle cx="290.0" cy="225.0" r="12" fill="#30363d" stroke="#6c737c" stroke-width="2"/><text x="290.0" y="229.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">1</text><circle cx="290.0" cy="345.0" r="12" fill="#3e3358" stroke="#906dc5" stroke-width="2"/><text x="290.0" y="349.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">1</text><circle cx="550.0" cy="285.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="550.0" y="289.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">2</text><circle cx="802.5" cy="285.0" r="12" fill="#19434b" stroke="#2e98a1" stroke-width="2"/><text x="802.5" y="289.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">3</text><circle cx="1078.0" cy="181.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="1078.0" y="185.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">4</text><circle cx="1078.0" cy="389.0" r="12" fill="#512f30" stroke="#c2605b" stroke-width="2"/><text x="1078.0" y="393.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">5</text><circle cx="940.0" cy="570.0" r="12" fill="#223b58" stroke="#4581c5" stroke-width="2"/><text x="940.0" y="574.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">6</text><circle cx="225.0" cy="480.0" r="12" fill="#30363d" stroke="#6c737c" stroke-width="2"/><text x="225.0" y="484.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">7</text><line x1="40" y1="662" x2="1320" y2="662" stroke="#2a313a" stroke-width="1.5"/><text x="40" y="674" font-size="13" font-weight="700" letter-spacing="1.4" fill="#a1abb7">STEPS</text><circle cx="52.0" cy="708.0" r="12" fill="#8b949e" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="712.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">1</text><text x="74.0" y="713" font-size="15" font-weight="700" fill="#e6edf3">Fix the inputs</text><text x="74.0" y="733" font-size="13.5" fill="#a1abb7">The golden set (dev and test splits) and the pipeline config (git SHA and config hash) go to the</text><text x="74.0" y="750" font-size="13.5" fill="#a1abb7">eval runner.</text><circle cx="712.0" cy="708.0" r="12" fill="#ff7b72" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="712.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">5</text><text x="734.0" y="713" font-size="15" font-weight="700" fill="#e6edf3">Fail: the change is blocked</text><text x="734.0" y="733" font-size="13.5" fill="#a1abb7">When any threshold is missed, CI fails and the merge is blocked.</text><circle cx="52.0" cy="780.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="784.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">2</text><text x="74.0" y="785" font-size="15" font-weight="700" fill="#e6edf3">Run and measure</text><text x="74.0" y="805" font-size="13.5" fill="#a1abb7">In CI, retrieval metrics run on the whole dev split and answer metrics on a 20-question smoke</text><text x="74.0" y="822" font-size="13.5" fill="#a1abb7">set; the full test split runs once per release.</text><circle cx="712.0" cy="780.0" r="12" fill="#58a6ff" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="784.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">6</text><text x="734.0" y="785" font-size="15" font-weight="700" fill="#e6edf3">Collect production feedback</text><text x="734.0" y="805" font-size="13.5" fill="#a1abb7">Thumbs-down ratings and traces from real use are gathered.</text><circle cx="52.0" cy="852.0" r="12" fill="#39c5cf" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="856.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">3</text><text x="74.0" y="857" font-size="15" font-weight="700" fill="#e6edf3">Compare with the thresholds</text><text x="74.0" y="877" font-size="13.5" fill="#a1abb7">The scores are checked against the absolute floors and the allowed drop from the baseline in</text><text x="74.0" y="894" font-size="13.5" fill="#a1abb7">evals/thresholds.yaml.</text><circle cx="712.0" cy="852.0" r="12" fill="#8b949e" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="856.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">7</text><text x="734.0" y="857" font-size="15" font-weight="700" fill="#e6edf3">Weekly triage feeds the golden set</text><text x="734.0" y="877" font-size="13.5" fill="#a1abb7">What triage finds is added back to the golden set, so real failures become tests.</text><circle cx="52.0" cy="924.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="928.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">4</text><text x="74.0" y="929" font-size="15" font-weight="700" fill="#e6edf3">Pass: the change can merge</text><text x="74.0" y="949" font-size="13.5" fill="#a1abb7">When every threshold is met, CI passes and a PR comment shows how each metric changed.</text></svg>
