<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1125" viewBox="0 0 1360 1125" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Verity RAG · Query pipeline</title><desc id="d">Query pipeline: guards, query rewrite, parallel dense and keyword search, reciprocal rank fusion and reranking. Gate 1 checks the rerank scores. With enough evidence, a grounded prompt goes to the LLM, which streams an answer with citations or replies NO_ANSWER (gate 2). A verifier checks each sentence against its source (gate 3). The answer is returned with each sentence marked as supported or not; if any gate fails, the API abstains and shows the closest sections.</desc><rect width="100%" height="100%" fill="#0d1117"/><text x="40" y="46" font-size="27" font-weight="700" fill="#e6edf3">Verity RAG · Query pipeline</text><text x="40" y="72" font-size="15" fill="#a1abb7">What happens between a question and a cited answer. Two exits: a checked answer, or an honest 'no answer' from any of three gates.</text><rect x="40" y="96" width="1280" height="246" rx="18" fill="none" stroke="#1d242d" stroke-width="1.6"/><text x="58" y="120" font-size="12" font-weight="700" letter-spacing="1.4" fill="#79828e">1 · PREPARE AND RETRIEVE</text><rect x="40" y="352" width="1280" height="146" rx="18" fill="none" stroke="#1d242d" stroke-width="1.6"/><text x="58" y="376" font-size="12" font-weight="700" letter-spacing="1.4" fill="#79828e">2 · RANK, THEN ANSWER FROM THE EVIDENCE</text><rect x="40" y="508" width="1280" height="132" rx="18" fill="none" stroke="#1d242d" stroke-width="1.6"/><text x="58" y="532" font-size="12" font-weight="700" letter-spacing="1.4" fill="#79828e">3 · RESULT</text><polyline points="255.0,215.0 325.0,215.0" fill="none" stroke="#3c6da7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="325.0,215.0 314.0,220.5 314.0,209.5" fill="#3c6da7"/><polyline points="515.0,215.0 585.0,215.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="585.0,215.0 574.0,220.5 574.0,209.5" fill="#2c793a"/><polyline points="775.0,215.0 810.0,215.0 810.0,160.0 845.0,160.0" fill="none" stroke="#9a5b2f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="845.0,160.0 834.0,165.5 834.0,154.5" fill="#9a5b2f"/><polyline points="775.0,215.0 810.0,215.0 810.0,270.0 845.0,270.0" fill="none" stroke="#9a5b2f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="845.0,270.0 834.0,275.5 834.0,264.5" fill="#9a5b2f"/><polyline points="1035.0,160.0 1070.0,160.0 1070.0,215.0 1105.0,215.0" fill="none" stroke="#7a5da7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1105.0,215.0 1094.0,220.5 1094.0,209.5" fill="#7a5da7"/><polyline points="1035.0,270.0 1070.0,270.0 1070.0,215.0 1105.0,215.0" fill="none" stroke="#7a5da7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1105.0,215.0 1094.0,220.5 1094.0,209.5" fill="#7a5da7"/><polyline points="1200.0,260.0 1200.0,385.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1200.0,385.0 1194.5,374.0 1205.5,374.0" fill="#2c793a"/><polyline points="1105.0,430.0 1050.0,430.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1050.0,430.0 1061.0,424.5 1061.0,435.5" fill="#2c793a"/><polyline points="830.0,430.0 775.0,430.0" fill="none" stroke="#927531" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="775.0,430.0 786.0,424.5 786.0,435.5" fill="#927531"/><text x="802" y="410" text-anchor="middle" font-size="12.5" font-style="italic" fill="#a1abb7" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">yes</text><polyline points="585.0,430.0 515.0,430.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="515.0,430.0 526.0,424.5 526.0,435.5" fill="#2c793a"/><polyline points="325.0,430.0 255.0,430.0" fill="none" stroke="#9a5b2f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="255.0,430.0 266.0,424.5 266.0,435.5" fill="#9a5b2f"/><polyline points="160.0,475.0 160.0,545.0" fill="none" stroke="#2c793a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="160.0,545.0 154.5,534.0 165.5,534.0" fill="#2c793a"/><polyline points="940.0,495.0 940.0,545.0" fill="none" stroke="#a3534f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="940.0,545.0 934.5,534.0 945.5,534.0" fill="#a3534f"/><polyline points="420.0,475.0 420.0,545.0" fill="none" stroke="#a3534f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="420.0,545.0 414.5,534.0 425.5,534.0" fill="#a3534f"/><polyline points="230.0,475.0 230.0,516.0 290.0,516.0 290.0,587.5 325.0,587.5" fill="none" stroke="#a3534f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="325.0,587.5 314.0,593.0 314.0,582.0" fill="#a3534f"/><text x="958" y="524" text-anchor="start" font-size="12.5" font-style="italic" fill="#a1abb7" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">no</text><text x="260" y="535" text-anchor="middle" font-size="12.5" font-style="italic" fill="#a1abb7" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">&gt; 30%</text><text x="438" y="524" text-anchor="start" font-size="12.5" font-style="italic" fill="#a1abb7" stroke="#0d1117" stroke-width="5" stroke-linejoin="round" paint-order="stroke">NO_ANSWER</text><rect x="65" y="170" width="190" height="90" rx="14" fill="#1d2a3a" stroke="#4279b9" stroke-width="2"/><text x="160.0" y="210.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">User question</text><text x="160.0" y="232.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">asked in the web app</text><rect x="325" y="170" width="190" height="90" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="420.0" y="202.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Guards</text><text x="420.0" y="224.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">rate limit, length,</text><text x="420.0" y="241.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">daily request limit</text><rect x="585" y="170" width="190" height="90" rx="14" fill="#2e2725" stroke="#ac6432" stroke-width="2"/><text x="680.0" y="210.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Rewrite query</text><text x="680.0" y="232.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">small LLM, for search</text><rect x="845" y="120" width="190" height="80" rx="14" fill="#28273a" stroke="#8867b9" stroke-width="2"/><text x="940.0" y="155.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Dense search</text><text x="940.0" y="177.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">vectors, top 50</text><rect x="845" y="230" width="190" height="80" rx="14" fill="#28273a" stroke="#8867b9" stroke-width="2"/><text x="940.0" y="265.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Keyword search</text><text x="940.0" y="287.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">full-text, top 50</text><rect x="1105" y="170" width="190" height="90" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="1200.0" y="210.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Fuse results</text><text x="1200.0" y="232.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">Reciprocal Rank Fusion</text><rect x="1105" y="385" width="190" height="90" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="1200.0" y="425.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Rerank</text><text x="1200.0" y="447.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">score the fused top 50</text><polygon points="940.0,365 1050,430.0 940.0,495 830,430.0" fill="#2d2c25" stroke="#a38234" stroke-width="2" stroke-linejoin="round"/><text x="940.0" y="425.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Enough evidence?</text><text x="940.0" y="447.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">gate 1: rerank scores</text><rect x="585" y="385" width="190" height="90" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="680.0" y="425.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Grounded prompt</text><text x="680.0" y="447.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">sources S1 to S8</text><rect x="325" y="385" width="190" height="90" rx="14" fill="#2e2725" stroke="#ac6432" stroke-width="2"/><text x="420.0" y="417.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">LLM answers</text><text x="420.0" y="439.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">streamed, cites S-numbers</text><text x="420.0" y="456.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">gate 2: NO_ANSWER reply</text><rect x="65" y="385" width="190" height="90" rx="14" fill="#1b2c27" stroke="#30873f" stroke-width="2"/><text x="160.0" y="417.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Verifier</text><text x="160.0" y="439.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">checks each sentence</text><text x="160.0" y="456.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">gate 3: support check</text><rect x="65" y="545" width="190" height="85" rx="14" fill="#1a2e35" stroke="#2c8f98" stroke-width="2"/><text x="160.0" y="574.5" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Checked answer</text><text x="160.0" y="596.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">each sentence marked</text><text x="160.0" y="613.5" text-anchor="middle" font-size="13.5" fill="#a1abb7">supported or not</text><rect x="325" y="545" width="710" height="85" rx="14" fill="#30262b" stroke="#b65b57" stroke-width="2"/><text x="680.0" y="583.0" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">No answer</text><text x="680.0" y="605.0" text-anchor="middle" font-size="13.5" fill="#a1abb7">plus the closest sections</text><circle cx="290.0" cy="215.0" r="12" fill="#223b58" stroke="#4581c5" stroke-width="2"/><text x="290.0" y="219.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">1</text><circle cx="550.0" cy="215.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="550.0" y="219.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">2</text><circle cx="810.0" cy="187.5" r="12" fill="#4d3222" stroke="#b76a34" stroke-width="2"/><text x="810.0" y="192.1" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">3</text><circle cx="810.0" cy="242.5" r="12" fill="#4d3222" stroke="#b76a34" stroke-width="2"/><text x="810.0" y="247.1" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">3</text><circle cx="1070.0" cy="187.5" r="12" fill="#3e3358" stroke="#906dc5" stroke-width="2"/><text x="1070.0" y="192.1" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">4</text><circle cx="1070.0" cy="242.5" r="12" fill="#3e3358" stroke="#906dc5" stroke-width="2"/><text x="1070.0" y="247.1" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">4</text><circle cx="1200.0" cy="322.5" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="1200.0" y="327.1" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">5</text><circle cx="1077.5" cy="430.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="1077.5" y="434.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">6</text><circle cx="802.5" cy="430.0" r="12" fill="#493e23" stroke="#ae8a36" stroke-width="2"/><text x="802.5" y="434.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">7</text><circle cx="550.0" cy="430.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="550.0" y="434.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">8</text><circle cx="290.0" cy="430.0" r="12" fill="#4d3222" stroke="#b76a34" stroke-width="2"/><text x="290.0" y="434.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">9</text><circle cx="160.0" cy="510.0" r="12" fill="#1b4027" stroke="#328f42" stroke-width="2"/><text x="160.0" y="514.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">10</text><circle cx="940.0" cy="520.0" r="12" fill="#512f30" stroke="#c2605b" stroke-width="2"/><text x="940.0" y="524.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">11</text><circle cx="420.0" cy="520.0" r="12" fill="#512f30" stroke="#c2605b" stroke-width="2"/><text x="420.0" y="524.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">11</text><circle cx="290.0" cy="552.0" r="12" fill="#512f30" stroke="#c2605b" stroke-width="2"/><text x="290.0" y="556.6" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">11</text><line x1="40" y1="662" x2="1320" y2="662" stroke="#2a313a" stroke-width="1.5"/><text x="40" y="674" font-size="13" font-weight="700" letter-spacing="1.4" fill="#a1abb7">STEPS</text><circle cx="52.0" cy="708.0" r="12" fill="#58a6ff" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="712.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">1</text><text x="74.0" y="713" font-size="15" font-weight="700" fill="#e6edf3">A user asks a question</text><text x="74.0" y="733" font-size="13.5" fill="#a1abb7">The question arrives at the Verity RAG API.</text><circle cx="712.0" cy="708.0" r="12" fill="#e3b341" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="712.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">7</text><text x="734.0" y="713" font-size="15" font-weight="700" fill="#e6edf3">Yes: build a grounded prompt</text><text x="734.0" y="733" font-size="13.5" fill="#a1abb7">The best passages become sources S1 to S8 in a prompt that says to answer only from them.</text><circle cx="52.0" cy="763.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="767.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">2</text><text x="74.0" y="768" font-size="15" font-weight="700" fill="#e6edf3">Guards run first</text><text x="74.0" y="788" font-size="13.5" fill="#a1abb7">The API checks the rate limit, the question length and the daily request limit before it calls any</text><text x="74.0" y="805" font-size="13.5" fill="#a1abb7">model.</text><circle cx="712.0" cy="763.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="767.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">8</text><text x="734.0" y="768" font-size="15" font-weight="700" fill="#e6edf3">The LLM answers with citations</text><text x="734.0" y="788" font-size="13.5" fill="#a1abb7">The answer streams back, citing sources as S-numbers. Gate 2: when the sources are not</text><text x="734.0" y="805" font-size="13.5" fill="#a1abb7">enough, the model replies NO_ANSWER.</text><circle cx="52.0" cy="835.0" r="12" fill="#f0883e" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="839.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">3</text><text x="74.0" y="840" font-size="15" font-weight="700" fill="#e6edf3">Rewrite, then search twice</text><text x="74.0" y="860" font-size="13.5" fill="#a1abb7">A small LLM rewrites the question for search. Dense (vector) search and keyword search then</text><text x="74.0" y="877" font-size="13.5" fill="#a1abb7">run in parallel, top 50 each.</text><circle cx="712.0" cy="835.0" r="12" fill="#f0883e" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="839.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">9</text><text x="734.0" y="840" font-size="15" font-weight="700" fill="#e6edf3">Gate 3: verify every sentence</text><text x="734.0" y="860" font-size="13.5" fill="#a1abb7">A small verifier model checks each sentence against the source it cites: supported, partial or</text><text x="734.0" y="877" font-size="13.5" fill="#a1abb7">unsupported.</text><circle cx="52.0" cy="907.0" r="12" fill="#bc8cff" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="911.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">4</text><text x="74.0" y="912" font-size="15" font-weight="700" fill="#e6edf3">Fuse the two result lists</text><text x="74.0" y="932" font-size="13.5" fill="#a1abb7">Reciprocal Rank Fusion merges the vector results and the keyword results into one ranking.</text><circle cx="712.0" cy="907.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="911.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">10</text><text x="734.0" y="912" font-size="15" font-weight="700" fill="#e6edf3">Return the checked answer</text><text x="734.0" y="932" font-size="13.5" fill="#a1abb7">If 30% or fewer sentences are unsupported, the answer stays, and the UI marks each sentence</text><text x="734.0" y="949" font-size="13.5" fill="#a1abb7">as supported or not.</text><circle cx="52.0" cy="979.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="983.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">5</text><text x="74.0" y="984" font-size="15" font-weight="700" fill="#e6edf3">Rerank the best candidates</text><text x="74.0" y="1004" font-size="13.5" fill="#a1abb7">A reranker scores the fused top 50 passages against the question.</text><circle cx="712.0" cy="979.0" r="12" fill="#ff7b72" stroke="#ffffff" stroke-width="2"/><text x="712.0" y="983.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">11</text><text x="734.0" y="984" font-size="15" font-weight="700" fill="#e6edf3">Any gate can abstain</text><text x="734.0" y="1004" font-size="13.5" fill="#a1abb7">Too little evidence, NO_ANSWER from the model, or more than 30% unsupported sentences:</text><text x="734.0" y="1021" font-size="13.5" fill="#a1abb7">the API says it has no answer and shows the closest sections.</text><circle cx="52.0" cy="1051.0" r="12" fill="#3fb950" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="1055.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">6</text><text x="74.0" y="1056" font-size="15" font-weight="700" fill="#e6edf3">Gate 1: is there enough evidence?</text><text x="74.0" y="1076" font-size="13.5" fill="#a1abb7">The top rerank score must reach a threshold, and at least two passages must score above a</text><text x="74.0" y="1093" font-size="13.5" fill="#a1abb7">second threshold.</text></svg>
